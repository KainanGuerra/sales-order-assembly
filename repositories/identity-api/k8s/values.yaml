# Values of the identity-api chart. The umbrella chart can override any of them.
replicaCount: 1

image:
  repository: sales-identity-api
  tag: local
  pullPolicy: IfNotPresent

ports:
  - { name: http, port: 3001 }
  - { name: grpc, port: 50051 }

probePath: /health

# Wait for these (host:port) before the service starts.
waitFor:
  - postgres:5432
  - rabbitmq:5672

# From the shared Secret. Listed first, so the values below can use them as $(NAME).
secretEnv:
  - { name: DB_PASSWORD, key: identity-db-password }
  - { name: INNER_AUTH, key: inner-auth }
  - { name: RABBITMQ_PASSWORD, key: rabbitmq-password }

env:
  CONSUMER_MAX_DELIVERIES: "5"
  DATABASE_URL: "postgres://identity_role:$(DB_PASSWORD)@postgres:5432/sales"
  DEFAULT_PRICE_TABLE_ID: "TP01"
  RABBITMQ_URL: "amqp://sales:$(RABBITMQ_PASSWORD)@rabbitmq:5672"
  RESERVATION_TTL_SECONDS: "900"

resources:
  requests: { cpu: 50m, memory: 128Mi }
  limits: { memory: 512Mi }

# Receive only from, and send only to, what is listed (everything else is denied).
networkPolicy:
  ingress:
    - from: [web]
      ports: [3001]
    - from: [orders-api]
      ports: [50051]
  egress:
    - to: [postgres]
      ports: [5432]
    - to: [rabbitmq]
      ports: [5672]

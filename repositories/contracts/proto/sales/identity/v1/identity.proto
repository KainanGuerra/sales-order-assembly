syntax = "proto3";

package sales.identity.v1;

// Synchronous reads that must be exact at the moment of the call.
// Called by orders-api while calculating and submitting an order.
// Missing ids are answered with the gRPC status NOT_FOUND.
service IdentityService {
  rpc GetClient(GetClientRequest) returns (GetClientResponse);
  rpc GetSeller(GetSellerRequest) returns (GetSellerResponse);

  // Holds credit for an order that is about to be saved. The check and the hold
  // are one atomic step, so two orders sent at once cannot both fit in credit
  // that only fits one. Repeating the call for the same order id answers the
  // same way and holds nothing extra.
  rpc ReserveCredit(ReserveCreditRequest) returns (ReserveCreditResponse);

  // Gives the hold back (the order could not be saved). Idempotent.
  rpc ReleaseCredit(ReleaseCreditRequest) returns (ReleaseCreditResponse);
}

message GetClientRequest {
  string client_id = 1;
}

message GetSellerRequest {
  string seller_id = 1;
}

message GetClientResponse {
  Client client = 1;
}

message GetSellerResponse {
  Seller seller = 1;
}

message ReserveCreditRequest {
  string client_id = 1;
  // The order the hold is for; also the idempotency key.
  string order_id = 2;
  int32 amount_cents = 3;
}

message ReserveCreditResponse {
  // false when the amount does not fit in the credit still available. This is
  // an answer, not an error.
  bool reserved = 1;
  // Credit available after this call (when reserved) or at the time of the
  // refusal (when not).
  int32 available_cents = 2;
}

message ReleaseCreditRequest {
  string order_id = 1;
}

message ReleaseCreditResponse {}

message Client {
  string id = 1;
  string trade_name = 2;
  // The seller whose portfolio holds this client.
  string seller_id = 3;
  // The price table to use. When the client has none, identity answers with
  // the default table and sets price_table_fallback.
  string price_table_id = 4;
  bool price_table_fallback = 5;
  int32 credit_limit_cents = 6;
  // Credit that is spoken for: what was already used, plus the orders that
  // were sent, plus the holds that have not expired. Available credit is
  // credit_limit_cents minus this.
  int32 credit_used_cents = 7;
}

message Seller {
  string id = 1;
  string name = 2;
  string supervisor_id = 3;
  // Maximum discount the seller may grant without approval, in basis points
  // (1% = 100).
  int32 discount_limit_bp = 4;
}

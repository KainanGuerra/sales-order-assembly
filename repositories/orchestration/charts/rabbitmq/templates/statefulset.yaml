apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  labels:
    {{- include "sales-lib.labels" . | nindent 4 }}
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      {{- include "sales-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sales-lib.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroup: {{ .Values.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rabbitmq
          image: {{ .Values.image }}
          ports:
            - name: amqp
              containerPort: 5672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: sales
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "sales-lib.secretName" . }}
                  key: rabbitmq-password
          readinessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: [rabbitmq-diagnostics, -q, ping]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # The one workload whose root filesystem is writable: the image's start
          # script writes its configuration under /etc/rabbitmq. Everything else
          # about its security settings is the same as the services'.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "sales-lib.labels" . | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "sales-lib.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "sales-lib.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsUser }}
        fsGroup: {{ .Values.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: sales
            # A subfolder: the mounted volume's own root is not empty.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            # The administrator's password, and one for each service's role: the
            # init script (the "postgres-init" ConfigMap) creates them on the first start.
            {{- range $env, $key := dict "POSTGRES_PASSWORD" "postgres-password" "IDENTITY_DB_PASSWORD" "identity-db-password" "CATALOG_DB_PASSWORD" "catalog-db-password" "ORDERS_DB_PASSWORD" "orders-db-password" "NOTIFICATIONS_DB_PASSWORD" "notifications-db-password" }}
            - name: {{ $env }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "sales-lib.secretName" $ }}
                  key: {{ $key }}
            {{- end }}
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d sales"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d sales"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "sales-lib.containerSecurity" . | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Where the server puts its socket, and its temporary files.
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: {{ .Values.storage }}

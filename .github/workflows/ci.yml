name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repositories/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:generated
      - run: pnpm typecheck
      - run: pnpm test

  services:
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-api, identity-api, orders-api]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-postgres
          POSTGRES_DB: sales
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sales"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      # Same roles and schemas as the compose stack (infra/postgres/init-schemas.sh).
      POSTGRES_USER: postgres
      POSTGRES_DB: sales
      PGHOST: 127.0.0.1
      PGPASSWORD: ci-postgres
      IDENTITY_DB_PASSWORD: ci-identity
      CATALOG_DB_PASSWORD: ci-catalog
      ORDERS_DB_PASSWORD: ci-orders
      NOTIFICATIONS_DB_PASSWORD: ci-notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: sh infra/postgres/init-schemas.sh
      - name: Build contracts
        working-directory: repositories/contracts
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install, lint, test
        working-directory: repositories/${{ matrix.service }}
        run: |
          # <name>-api -> <name>_role / ci-<name> (catalog, identity, orders)
          name="${{ matrix.service }}"; name="${name%-api}"
          export TEST_DATABASE_URL="postgres://${name}_role:ci-${name}@127.0.0.1:5432/sales"
          pnpm install --frozen-lockfile
          pnpm lint
          pnpm test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: repositories/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [catalog-api, identity-api, orders-api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sales-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: repositories
          file: repositories/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-web:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/sales-web
          tags: |
            type=sha,format=long
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: repositories/web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

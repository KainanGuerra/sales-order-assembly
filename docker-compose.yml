# Shared infrastructure. Services are added to this file as they are built.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set - run sh scripts/init-env.sh}
      POSTGRES_DB: sales
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?IDENTITY_DB_PASSWORD must be set}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?CATALOG_DB_PASSWORD must be set}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?ORDERS_DB_PASSWORD must be set}
      NOTIFICATIONS_DB_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?NOTIFICATIONS_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/init-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: sales
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set - run sh scripts/init-env.sh}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set - run sh scripts/init-env.sh}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  catalog-api:
    build:
      context: ./repositories
      dockerfile: catalog-api/Dockerfile
    environment:
      DATABASE_URL: postgres://catalog_role:${CATALOG_DB_PASSWORD}@postgres:5432/sales
      INNER_AUTH: ${INNER_AUTH:?INNER_AUTH must be set}
      SHOW_UNAVAILABLE_PRODUCTS: ${SHOW_UNAVAILABLE_PRODUCTS:-true}
      SEED_FILE: /data/seed.json
    volumes:
      - ./seed.json:/data/seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  identity-api:
    build:
      context: ./repositories
      dockerfile: identity-api/Dockerfile
    environment:
      DATABASE_URL: postgres://identity_role:${IDENTITY_DB_PASSWORD}@postgres:5432/sales
      INNER_AUTH: ${INNER_AUTH:?INNER_AUTH must be set}
      DEFAULT_PRICE_TABLE_ID: ${DEFAULT_PRICE_TABLE_ID:-TP01}
      SEED_FILE: /data/seed.json
      RABBITMQ_URL: amqp://sales:${RABBITMQ_PASSWORD}@rabbitmq:5672
      RESERVATION_TTL_SECONDS: ${RESERVATION_TTL_SECONDS:-900}
      CONSUMER_MAX_DELIVERIES: ${CONSUMER_MAX_DELIVERIES:-5}
    volumes:
      - ./seed.json:/data/seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  orders-api:
    build:
      context: ./repositories
      dockerfile: orders-api/Dockerfile
    environment:
      DATABASE_URL: postgres://orders_role:${ORDERS_DB_PASSWORD}@postgres:5432/sales
      INNER_AUTH: ${INNER_AUTH:?INNER_AUTH must be set}
      CATALOG_GRPC_URL: catalog-api:50052
      IDENTITY_GRPC_URL: identity-api:50051
      RABBITMQ_URL: amqp://sales:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MIN_ORDER_CENTS: ${MIN_ORDER_CENTS:-30000}
      MAX_DISCOUNT_BP: ${MAX_DISCOUNT_BP:-1000}
      DEFAULT_PRICE_TABLE_ID: ${DEFAULT_PRICE_TABLE_ID:-TP01}
      SEED_FILE: /data/seed.json
    volumes:
      - ./seed.json:/data/seed.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      identity-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build:
      context: ./repositories/web
    environment:
      NUXT_INNER_AUTH: ${INNER_AUTH:?INNER_AUTH must be set}
      NUXT_IDENTITY_URL: http://identity-api:3001
      NUXT_CATALOG_URL: http://catalog-api:3002
      NUXT_ORDERS_URL: http://orders-api:3003
      NUXT_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # Turn on when the app is served over HTTPS.
      NUXT_SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    # The only service that publishes a port: the browser reaches the system through it.
    ports:
      - "${WEB_PORT:-8080}:3000"
    depends_on:
      redis:
        condition: service_healthy
      identity-api:
        condition: service_healthy
      catalog-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6

volumes:
  postgres-data:
